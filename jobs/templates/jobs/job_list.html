{% extends "base.html" %}

{% block content %}


<!-- Blog Entries Column -->
<div class="col-12 mt-3 left">
    <div class="row">
        {% for job in job_list %}
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-body">
                    <a href="#" class="post-link">
                        <h2 class="card-title">{{ job.title }}</h2>
                    </a>
                    <p class="card-text">{{ job.company }}</p>
                    <hr />
                    <p class="card-text">{{ job.location }}</p>
                    <hr />
                </div>
            </div>
        </div>
        {% if forloop.counter|divisibleby:3 %}
    </div>
    <div class="row">
        {% endif %}
        {% endfor %}

    </div>
</div>
</div>

{% endblock %}
