{% load static %}

{% url 'home' as home_url %}

<!doctype html>
<html class="h-100" lang="en">

<head>
  <title>Talent Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />


  <!-- Custom  CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="d-flex flex-column h-100 main-bg">
  <!-- Navigation -->
  <nav id="navbar" class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a id="logo" class="navbar-brand" href="#">Talent Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Jobs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Companies</a>
          </li>
        </ul>
        <span class="navbar-text">
          <button class="btn login-btn"> Login / Register</button>
        </span>
      </div>
    </div>
  </nav>

  <main class="flex-shrink-0 main-bg">
    {% block content %}
    <!-- Content Goes here -->
    {% endblock content %}
  </main>

  <!-- Footer -->
  <footer id="footer" class="mt-auto">
    <div class="container">
      <div class="row">
        <!-- link to social media sites -->
        <div id="socials" class="col text-center">
          <p>
            <a href="https://facebook.com" target="_blank" aria-label="facebook"><i
                class="fa-brands fa-square-facebook"></i></a>
            <a href="https://instagram.com" target="_blank" aria-label="instagram"><i
                class="fa-brands fa-instagram"></i></a>
            <a href="https://twitter.com" target="_blank" aria-label="twitter"><i
                class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.tiktok.com" target="_blank" aria-label="tiktok"><i class="fa-brands fa-tiktok"></i></a>
          </p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Font awesome -->
  <script src="https://kit.fontawesome.com/3312e5dbfd.js" crossorigin="anonymous"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
