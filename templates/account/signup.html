{% extends "base.html" %}
{% load allauth account %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="custom-card">
                <div class="card-body">
                    <h1>Sign Up</h1>
                    <p>
                        Already have an account? <a href="{{ login_url }}">Sign in</a> instead.
                    </p>

                    {% url 'account_signup' as signup_url %}
                    <form method="post" action="{{ signup_url }}">
                        {% csrf_token %}
                        {{ form.as_p }}
                        {{ redirect_field }}
                        <button class="btn login-btn" type="submit">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
